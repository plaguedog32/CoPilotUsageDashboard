# Builds the app and deploys it to an Azure Web App (App Service).
# Run it by hand from the Actions tab. Full first-time setup: docs/SETUP.md. Before the first run:
#   1. Create the Web App (.NET 10, Web sockets on, ARR affinity on, one instance), Azure SQL and Key Vault.
#   2. Add a federated credential (OIDC, environment "production") for this repo to an Entra app registration with
#      Website Contributor on the Web App, then set repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID,
#      AZURE_SUBSCRIPTION_ID and AZURE_WEBAPP_NAME.
#   3. Set the app settings AzureAd__TenantId, AzureAd__ClientId, KeyVault__Uri, Database__Provider and the Default
#      connection string. GitHub credentials are entered later on the app's Setup page, which saves them to Key Vault.
name: Deploy to Azure Web App

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/CopilotBudget/CopilotBudget.csproj -c Release -o ${{ runner.temp }}/app

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/app
